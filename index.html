<!doctype html>
<!--
    File Name: Daybook.html
    Description: A simple daily planner to add, update, complete and delete tasks.
    Author: Shubham Somanath Gadhe

    Features:
    - Daily and weekly task planning
    - Task priority, category and reminders
    - Task history and completion summary
    - Saves tasks in browser local storage
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232747F0'/%3E%3Cpath d='M9 9h9a5 5 0 015 5v9H14a5 5 0 01-5-5z' fill='none' stroke='white' stroke-width='2.2'/%3E%3C/svg%3E">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}</style>
<title>Daybook</title>
<style>
/* Main page layout and common colors */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --surface-2:#F4F7F6; --ink:#10242A; --ink-2:#4A6168; --line:#D5DEDC;
  --accent:#2747F0; --accent-ink:#FFFFFF; --accent-soft:#E2E7FF;
  --amber:#B86E00; --amber-soft:#FFEFCF; --good:#12805C; --good-soft:#D8F1E6; --bad:#C2342B; --bad-soft:#FBE2DF;
  --shadow:0 1px 2px rgba(16,36,42,.06),0 8px 24px rgba(16,36,42,.06);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'DM Sans','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1316; --surface:#141E22; --surface-2:#1A262B; --ink:#E8F0EE; --ink-2:#98ADB3; --line:#26353B;
  --accent:#8497FF; --accent-ink:#0B1020; --accent-soft:#1E2749;
  --amber:#FFC24D; --amber-soft:#3A2D10; --good:#4CD3A0; --good-soft:#12342A; --bad:#FF8279; --bad-soft:#3E1B19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1316; --surface:#141E22; --surface-2:#1A262B; --ink:#E8F0EE; --ink-2:#98ADB3; --line:#26353B;
  --accent:#8497FF; --accent-ink:#0B1020; --accent-soft:#1E2749;
  --amber:#FFC24D; --amber-soft:#3A2D10; --good:#4CD3A0; --good-soft:#12342A; --bad:#FF8279; --bad-soft:#3E1B19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
[hidden]{display:none!important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.mark svg{width:18px;height:18px}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.tabs button{border:0;background:transparent;padding:7px 18px;border-radius:999px;font-weight:600;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* hero */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{margin:0;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{margin:2px 0 4px;font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,56px);line-height:1;letter-spacing:-.03em;text-wrap:balance}
.sub{margin:0;color:var(--ink-2);max-width:52ch}
.jump{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.jump label{font-size:12px;color:var(--ink-2);font-weight:600}

/* inputs & buttons */
input[type=text],input[type=date],input[type=time],select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
input::placeholder{color:var(--ink-2);opacity:.8}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.ghost{background:transparent}
.ico{display:inline-grid;place-items:center;width:18px;height:18px}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn{border:0;background:transparent;width:34px;height:34px;border-radius:9px;display:inline-grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn.danger:hover{color:var(--bad);background:var(--bad-soft)}

/* week strip */
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.weekbar b{font-family:var(--display);font-size:16px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.day:hover{border-color:var(--ink-2)}
.day .wd{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.day .dn{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1}
.day .cnt{font-family:var(--mono);font-size:10.5px;color:var(--ink-2)}
.day .meter{width:70%;height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:3px}
.day .meter i{display:block;height:100%;background:var(--good)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day[aria-pressed="true"] .wd,.day[aria-pressed="true"] .cnt{color:inherit;opacity:.8}
.day[aria-pressed="true"] .meter{background:rgba(128,128,128,.4)}
.day.is-today:not([aria-pressed="true"]) .dn{color:var(--accent)}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px;align-items:start}
.main,.rail{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:880px){.layout{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-family:var(--display);font-size:15px;letter-spacing:-.01em}

/* composer */
.composer{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.composer .main-row{display:flex;gap:8px}
.composer #f-title{font-size:16px;padding:12px 14px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}
.opts label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;font-weight:700;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase;min-width:0}
.opts input,.opts select{font-size:14px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.editbar{display:flex;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:10px;padding:6px 6px 6px 12px;font-weight:600;font-size:13px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--amber-soft);color:var(--ink);border-radius:12px;padding:8px 8px 8px 14px;font-size:13.5px}

/* list */
.listhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.listhead h2{margin:0;font-family:var(--display);font-size:22px;letter-spacing:-.02em}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tasklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px 10px 12px}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink-2);background:transparent;display:grid;place-items:center;color:transparent;padding:0}
.check .ico{width:16px;height:16px}
.check:hover{border-color:var(--accent)}
.is-done .check{background:var(--good);border-color:var(--good);color:#fff}
.tbody{min-width:0}
.ttitle{font-weight:600;overflow-wrap:anywhere}
.is-done .ttitle{color:var(--ink-2);text-decoration:line-through;text-decoration-thickness:1.5px}
.tnote{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.chip .ico{width:12px;height:12px}
.chip.time{font-family:var(--mono);font-weight:500;color:var(--ink)}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.high{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.tactions{display:flex;align-items:center;gap:2px}
.empty{text-align:center;color:var(--ink-2);padding:34px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:18px;margin-bottom:2px}
.carry{background:var(--bad-soft);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.carry .head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-left:4px}
.carry .head b{font-family:var(--display);color:var(--bad)}

/* rail */
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:116px;height:116px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px}
.ringtext b{display:block;font-family:var(--display);font-size:20px;letter-spacing:-.02em}
.ringtext span{color:var(--ink-2);font-size:13.5px}
.next .when{font-family:var(--mono);color:var(--accent);font-size:13px}
.next .what{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.muted{color:var(--ink-2);font-size:13.5px;margin:6px 0 0}
.stack{display:flex;flex-direction:column;gap:8px}
.status{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.status .dot{width:9px;height:9px;border-radius:50%;background:var(--ink-2);margin-top:6px;flex:none}
.status .dot.on{background:var(--good)}

/* history */
.hsum{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:20px}
@media (max-width:760px){.hsum{grid-template-columns:minmax(0,1fr)}}
.big{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;letter-spacing:-.04em}
.big small{font-size:28px}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13.5px;color:var(--ink-2)}
.facts b{color:var(--ink);font-family:var(--mono);font-weight:500}
.chartscroll{overflow-x:auto;padding-bottom:4px}
.plot{position:relative;display:flex;align-items:flex-end;gap:6px;height:160px;border-bottom:1px solid var(--line);min-width:max-content;width:100%}
.plot::before,.plot::after{content:"";position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.plot::before{top:0}.plot::after{top:50%}
.col{position:relative;z-index:1;flex:1 1 0;min-width:20px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;border:0;background:transparent;padding:0}
.col .d{background:var(--accent);border-radius:4px 4px 0 0}
.col .r{background:repeating-linear-gradient(135deg,var(--amber) 0 2px,var(--amber-soft) 2px 6px)}
.col .d:first-child{border-radius:4px 4px 0 0}
.col:hover{opacity:.8}
.labels{display:flex;gap:6px;margin-top:6px;min-width:max-content;width:100%}
.labels div{flex:1 1 0;min-width:20px;text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--ink-2);line-height:1.2}
.labels .today{color:var(--accent);font-weight:700}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.legend .ld{background:var(--accent)}.legend .lr{background:repeating-linear-gradient(135deg,var(--amber) 0 2px,var(--amber-soft) 2px 6px)}
.daygroup{display:flex;flex-direction:column;gap:8px}
.daygroup .gh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}
.daygroup .gh button{border:0;background:transparent;padding:0;font-family:var(--display);font-weight:700;font-size:17px;text-align:left}
.daygroup .gh button:hover{color:var(--accent)}

/* toasts */
.toasts{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:50}
.toast{pointer-events:auto;width:min(440px,100%);background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 12px 12px 14px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 10px 30px rgba(0,0,0,.28);animation:rise .22s ease-out}
.toast .tx{flex:1;min-width:0}
.toast b{display:block;overflow-wrap:anywhere}
.toast span.sm{font-size:13px;opacity:.85}
.toast .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.toast .acts button{border:0;border-radius:8px;padding:5px 10px;font-weight:700;font-size:13px;background:var(--bg);color:var(--ink)}
.toast .x{border:0;background:transparent;color:inherit;opacity:.7;width:26px;height:26px;border-radius:8px;padding:0;display:grid;place-items:center}
.toast .bell{color:var(--amber);flex:none;margin-top:2px}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><span class="mark" id="logo"></span>Daybook</div>
    <div class="tabs" role="tablist" aria-label="Views">
      <button id="tab-plan" role="tab" aria-selected="true" type="button">Planner</button>
      <button id="tab-history" role="tab" aria-selected="false" type="button">History</button>
    </div>
  </header>

  <section id="view-plan" aria-label="Planner">
    <div class="app">
      <div class="hero">
        <div>
          <p class="eyebrow" id="hero-day"></p>
          <h1 id="hero-date"></h1>
          <p class="sub" id="hero-sub"></p>
        </div>
        <div class="jump">
          <label for="jump-date">Jump to date</label>
          <input type="date" id="jump-date" style="width:auto">
          <button class="btn" type="button" id="btn-today">Today</button>
        </div>
      </div>

      <div>
        <div class="weekbar">
          <button class="iconbtn" type="button" id="wk-prev" aria-label="Previous week"></button>
          <b id="wk-label"></b>
          <button class="iconbtn" type="button" id="wk-next" aria-label="Next week"></button>
        </div>
        <div class="week" id="week"></div>
      </div>

      <div class="layout">
        <div class="main">
          <div class="banner" id="banner" hidden>
            <span>Sample tasks are loaded so you can see how the planner and history look.</span>
            <button class="btn small" type="button" id="btn-clear-samples">Clear samples</button>
          </div>

          <form class="composer" id="composer" autocomplete="off">
            <div class="main-row">
              <input type="text" id="f-title" placeholder="What needs doing?" maxlength="140" aria-label="Task title">
              <button type="submit" class="btn primary" id="f-submit">Add task</button>
            </div>
            <div class="opts">
              <label for="f-date">Date<input type="date" id="f-date"></label>
              <label for="f-time">Time<input type="time" id="f-time"></label>
              <label for="f-remind">Remind me
                <select id="f-remind">
                  <option value="0">At start time</option>
                  <option value="10" selected>10 min before</option>
                  <option value="30">30 min before</option>
                  <option value="60">1 hour before</option>
                  <option value="-1">No reminder</option>
                </select>
              </label>
              <label for="f-prio">Priority
                <select id="f-prio">
                  <option value="high">High</option>
                  <option value="med" selected>Medium</option>
                  <option value="low">Low</option>
                </select>
              </label>
              <label for="f-cat">Category
                <select id="f-cat">
                  <option value="">None</option>
                  <option>Study</option><option>Work</option><option>Personal</option><option>Health</option>
                </select>
              </label>
            </div>
            <input type="text" id="f-note" placeholder="Note (optional)" maxlength="240" aria-label="Note">
            <div class="editbar" id="editbar" hidden>
              <span>Editing a task</span>
              <button class="btn small" type="button" id="f-cancel">Cancel</button>
            </div>
          </form>

          <div id="carry"></div>

          <div class="listhead">
            <h2 id="list-title">Today</h2>
            <div class="seg" id="filter" role="group" aria-label="Filter tasks"></div>
          </div>
          <div id="list"></div>
        </div>

        <aside class="rail" aria-label="Day summary">
          <section class="card" id="ring-card"></section>
          <section class="card next" id="next-card"></section>
          <section class="card" id="alerts-card"></section>
        </aside>
      </div>
    </div>
  </section>

  <section id="view-history" aria-label="History" hidden>
    <div class="app">
      <div class="listhead">
        <h1 style="font-size:clamp(30px,5vw,44px);margin:0">History</h1>
        <div class="seg" id="range" role="group" aria-label="Time range"></div>
      </div>
      <div class="card hsum" id="hsum"></div>
      <div class="listhead">
        <h2>Day by day</h2>
        <div class="seg" id="hfilter" role="group" aria-label="Filter history"></div>
      </div>
      <div id="hlist" class="stack"></div>
    </div>
  </section>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parse=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var addDays=function(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
var todayStr=function(){return ymd(new Date())};
var nowHM=function(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
var LOC='en-IN';
var fmtLong=function(s,o){return parse(s).toLocaleDateString(LOC,o)};
// Method Name: fmtTime
// Description: Converts 24-hour time into 12-hour time.
function fmtTime(hm){if(!hm)return'';var p=hm.split(':').map(Number);return (p[0]%12||12)+':'+pad(p[1])+' '+(p[0]<12?'AM':'PM')}
// Method Name: relDay
// Description: Returns a readable name for a date.
function relDay(s){var t=todayStr();if(s===t)return'Today';if(s===addDays(t,1))return'Tomorrow';if(s===addDays(t,-1))return'Yesterday';return fmtLong(s,{weekday:'short',day:'numeric',month:'short'})}
// Method Name: relMins
// Description: Converts reminder time into minutes or hours.
function relMins(ms){var m=Math.max(0,Math.round(ms/60000));if(m<60)return m+' min';var h=Math.floor(m/60);return h+' h'+(m%60?' '+(m%60)+' min':'')}

var ICONS={
  check:'<path d="M20 6L9 17l-5-5"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
  trash:'<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/>',

// Method Name: ico
// Description: Creates an icon element.
function ico(n){var s=document.createElement('span');s.className='ico';s.setAttribute('aria-hidden','true');s.innerHTML='<svg viewBox="0 0 24 24">'+ICONS[n]+'</svg>';return s}
// Method Name: h
// Description: Creates an HTML element and adds its attributes and children.
function h(tag,attrs){
  var e=document.createElement(tag);
  if(attrs)for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');else e.setAttribute(k,v)}
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(Array.isArray(c)){c.forEach(function(x){if(x!=null&&x!==false)e.append(x.nodeType?x:document.createTextNode(x))})}
    else if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c))}
  return e;
}

// Methods used to save and load planner data.
// Method Name: clean
// Description: Copies task data without undefined values.
function clean(t){var o={};for(var k in t)if(t[k]!==undefined)o[k]=t[k];return o}
// Method Name: queue
// Description: Runs save operations one after another.
function queue(id,fn){
  S.chains[id]=(S.chains[id]||Promise.resolve()).then(fn).catch(function(){toast({title:'Could not save',body:'Check your connection. Your latest change may not be stored.'})});
}
// Method Name: saveLocal
// Description: Saves all tasks in browser local storage.
function saveLocal(){try{localStorage.setItem('daybook.v1',JSON.stringify(Array.from(S.tasks.entries())))}catch(e){}}
// Method Name: loadLocal
// Description: Loads saved tasks from browser local storage.
function loadLocal(){try{var r=localStorage.getItem('daybook.v1');return r?JSON.parse(r):null}catch(e){return null}}
// Method Name: persist
// Description: Saves one task when cloud storage is enabled.
function persist(id){
  var t=S.tasks.get(id);if(!t)return;
  if(S.mode==='cloud')queue(id,function(){return S.col.doc(id).set(clean(t))});
  else if(S.mode==='local')saveLocal();
}
// Method Name: persistDelete
// Description: Removes a task from saved data.
function persistDelete(id){
  if(S.mode==='cloud')queue(id,function(){return S.col.doc(id).delete()});
  else if(S.mode==='local')saveLocal();
}
// Method Name: newId
// Description: Creates a unique ID for a task.
function newId(){return 't_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
// Method Name: loadNotified
// Description: Loads reminders that have already been shown.
function loadNotified(){try{var a=JSON.parse(localStorage.getItem('daybook.notified')||'[]');a.forEach(function(k){S.notified.add(k)})}catch(e){}}
// Method Name: saveNotified
// Description: Saves the reminders that were already shown.
function saveNotified(){try{var t=todayStr();var a=Array.from(S.notified).filter(function(k){return k.split('|')[1]>=addDays(t,-1)});localStorage.setItem('daybook.notified',JSON.stringify(a))}catch(e){}}

/* ---------- queries ---------- */
// Method Name: byTime
// Description: Sorts tasks by time and creation date.
function byTime(a,b){return (a[1].time||'99:99').localeCompare(b[1].time||'99:99')||(a[1].createdAt||'').localeCompare(b[1].createdAt||'')}
// Method Name: tasksOn
// Description: Returns all tasks for the selected date.
function tasksOn(d){return Array.from(S.tasks).filter(function(e){return e[1].date===d}).sort(byTime)}
// Method Name: dayStat
// Description: Returns the total and completed task count for a date.
function dayStat(d){var ts=tasksOn(d);return{d:d,total:ts.length,done:ts.filter(function(e){return e[1].done}).length}}

/* ---------- actions ---------- */
// Method Name: toggle
// Description: Marks a task as completed or incomplete.
function toggle(id){
  var t=S.tasks.get(id);if(!t)return;
  S.tasks.set(id,Object.assign({},t,{done:!t.done,doneAt:!t.done?new Date().toISOString():null}));
  persist(id);renderAll();
}
// Method Name: removeTask
// Description: Deletes a task from the planner.
function removeTask(id){
  var t=S.tasks.get(id);if(!t)return;

  if(S.editing===id)resetComposer();
  renderAll();
  toast({title:'Task deleted',body:t.title,ttl:6000,actions:[{label:'Undo',fn:function(){S.tasks.set(id,t);persist(id);renderAll()}}]});
}

// Method Name: streak

// Description: Calculates the current task completion streak.

function streak(){
  var t=todayStr(),n=0;
  for(var i=0;i<90;i++){
    var st=dayStat(addDays(t,-i));
    // An empty day does not count. Allow today to be empty and continue
    // yesterday's streak, but an empty day in the past breaks the streak.
    if(!st.total){if(i===0)continue;break;}
    if(st.done===st.total)n++;
    else if(i===0)continue;
    else break;
  }
  return n;
}

      h('span',{},h('b',{text:String(streak())}),' day clean streak')));
  var plot=h('div',{class:'plot'}),labels=h('div',{class:'labels'});
  stats.forEach(function(s){
    var rem=s.total-s.done;
    var col=h('button',{type:'button',class:'col',title:fmtLong(s.d,{weekday:'short',day:'numeric',month:'short'})+': '+s.done+' done, '+rem+' remaining',

      rem?h('div',{class:'r',style:'height:'+(rem/max*100)+'%'}):null,
      s.done?h('div',{class:'d',style:'height:'+(s.done/max*100)+'%'}):null);
    plot.append(col);
    var d=parse(s.d);
    labels.append(h('div',{class:s.d===t?'today':''},S.range<=14?h('div',{text:d.toLocaleDateString(LOC,{weekday:'narrow'})}):null,h('div',{text:String(d.getDate())})));
  });
  var right=h('div',{},h('div',{class:'chartscroll'},plot,labels),
    h('div',{class:'legend'},h('span',{},h('i',{class:'ld'}),'Completed'),h('span',{},h('i',{class:'lr'}),'Remaining'),h('span',{text:'Tap a bar to open that day'})));
  $('#hsum').replaceChildren(left,right);

  var box=$('#hlist');box.replaceChildren();var shown=0;
  days.slice().reverse().forEach(function(d){
    var rows=tasksOn(d);if(!rows.length)return;
    var st=dayStat(d);
    if(S.hfilter==='done')rows=rows.filter(function(e){return e[1].done});
    if(S.hfilter==='open')rows=rows.filter(function(e){return !e[1].done});
    if(!rows.length)return;shown++;
    box.append(h('div',{class:'daygroup'},
      h('div',{class:'gh'},h('button',{type:'button',onclick:function(){S.tab='plan';setSel(d);applyTab()}},relDay(d)+' · '+fmtLong(d,{day:'numeric',month:'short'})),
        h('span',{class:'chip '+(st.done===st.total?'good':''),text:st.done+' of '+st.total+' done'})),
      h('ul',{class:'tasklist'},rows.map(function(e){return taskRow(e[0],e[1],{move:true})}))));
  });
  if(!shown)box.append(h('div',{class:'empty'},h('b',{text:'No tasks to show'}),'Nothing matches this range and filter yet.'));
}

// Method Name: renderAll

// Description: Refreshes the planner views.

function renderAll(){
  $('#banner').hidden=!Array.from(S.tasks.values()).some(function(t){return t.sample});
  renderHero();renderWeek();renderCarry();renderList();renderRing();renderNext();renderAlerts();
  if(S.tab==='history')renderHistory();
}
// Method Name: applyTab
// Description: Switches between planner and history views.
function applyTab(){
  $('#view-plan').hidden=S.tab!=='plan';$('#view-history').hidden=S.tab!=='history';
  $('#tab-plan').setAttribute('aria-selected',String(S.tab==='plan'));$('#tab-history').setAttribute('aria-selected',String(S.tab==='history'));
  renderAll();window.scrollTo(0,0);
}
$('#tab-plan').addEventListener('click',function(){S.tab='plan';applyTab()});
$('#tab-history').addEventListener('click',function(){S.tab='history';applyTab()});
$('#btn-today').addEventListener('click',function(){setSel(todayStr())});
$('#jump-date').addEventListener('change',function(e){if(e.target.value)setSel(e.target.value)});
$('#wk-prev').addEventListener('click',function(){setSel(addDays(S.sel,-7))});
$('#wk-next').addEventListener('click',function(){setSel(addDays(S.sel,7))});
$('#btn-clear-samples').addEventListener('click',clearSamples);
$('#wk-prev').append(ico('left'));$('#wk-next').append(ico('right'));$('#logo').append(ico('book'));

/* ---------- toasts, chime, reminders ---------- */
// Method Name: toast
// Description: Displays a short message on the page.
function toast(o){
  var box=$('#toasts');
  var el=h('div',{class:'toast',role:'status'});
  var tx=h('div',{class:'tx'},h('b',{text:o.title}),o.body?h('span',{class:'sm',text:o.body}):null);
  if(o.actions&&o.actions.length){tx.append(h('div',{class:'acts'},o.actions.map(function(a){return h('button',{type:'button',onclick:function(){el.remove();a.fn()}},a.label)})))}
  if(o.bell)el.append(h('span',{class:'bell'},ico('bell')));
  el.append(tx,h('button',{class:'x',type:'button','aria-label':'Dismiss',onclick:function(){el.remove()}},ico('x')));
  box.append(el);
  while(box.children.length>4)box.firstChild.remove();
  if(o.ttl)setTimeout(function(){el.remove()},o.ttl);
}
var AC=null;
// Method Name: chime
// Description: Plays a short reminder sound.
function chime(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.resume)AC.resume();
    [660,880].forEach(function(f,i){
      var o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+i*.16;
      o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.18,t0+.02);g.gain.exponentialRampToValueAtTime(.001,t0+.35);
      o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+.4);
    });
  }catch(e){}
}
// Method Name: systemNotify
// Description: Displays a browser notification.
function systemNotify(title,body,tag){
  try{if('Notification' in window&&Notification.permission==='granted')new Notification(title,{body:body,tag:tag||'daybook'})}catch(e){}
}
// Method Name: enableAlerts
// Description: Requests permission to show browser notifications.
function enableAlerts(){
  try{
    var p=Notification.requestPermission();
    Promise.resolve(p).then(function(r){
      renderAlerts();
      toast({title:r==='granted'?'System notifications are on':'Notifications were not enabled',
        body:r==='granted'?'You will also get alerts outside this tab while Daybook stays open.':'In-page reminders keep working while Daybook is open.',ttl:4000});
    }).catch(function(){renderAlerts()});
  }catch(e){toast({title:'Notifications are unavailable here',body:'In-page reminders keep working while Daybook is open.',ttl:4000});renderAlerts()}
}
// Method Name: fireReminder
// Description: Shows a reminder for a task.
function fireReminder(id,o){
  chime();
  var acts=[];
  if(id){acts.push({label:'Mark done',fn:function(){var t=S.tasks.get(id);if(t&&!t.done)toggle(id)}});
    acts.push({label:'Snooze 10 min',fn:function(){S.snooze.set(id,Date.now()+600000)}})}
  toast({title:o.title,body:o.body,bell:true,actions:acts});
  systemNotify(o.title,o.body,id);
}
// Method Name: checkReminders
// Description: Checks whether any task reminder should be shown.
function checkReminders(){
  var now=Date.now(),changed=false;
  S.tasks.forEach(function(t,id){
    if(t.done||t.sample||!t.time||t.remind==null||t.remind<0)return;
    var p=t.time.split(':'),start=parse(t.date);start.setHours(+p[0],+p[1],0,0);
    var sn=S.snooze.get(id),eff=sn||(start.getTime()-t.remind*60000);
    var key=id+'|'+t.date+'|'+t.time+'|'+t.remind+(sn?'|s'+sn:'');
    if(now>=eff&&now<start.getTime()+3*3600000&&!S.notified.has(key)){
      S.notified.add(key);changed=true;
      var diff=start.getTime()-now;
      fireReminder(id,{title:t.title,body:(diff>60000?'Starts in '+relMins(diff):'Starting now')+' · '+fmtTime(t.time)});
    }
  });
  if(changed)saveNotified();
}
var lastDay=todayStr();
setInterval(function(){
  checkReminders();
  var t=todayStr();
  if(t!==lastDay){if(S.sel===lastDay&&!S.editing)S.sel=t;lastDay=t;renderAll()}
  else{renderNext();renderHero()}
},15000);

// Start the planner and load saved tasks.
loadNotified();
S.tasks=new Map(seed());
resetComposer();applyTab();

(async function init(){
  // Standalone desktop edition: use persistent local storage on this laptop.
  var db=null,uid=null;
  if(db&&uid){
    S.mode='cloud';S.col=db.collection('data/users/'+uid);
    S.col.onSnapshot(function(snap){
      var m=new Map(),meta=false;
      snap.docs.forEach(function(d){if(d.id==='_meta'){meta=true;return}m.set(d.id,d.data())});
      S.tasks=m;
      if(!snap.metadata.fromCache&&!meta&&m.size===0&&!S.seeded){
        S.seeded=true;
        seed().forEach(function(e){S.tasks.set(e[0],e[1]);persist(e[0])});
        queue('_meta',function(){return S.col.doc('_meta').set({seeded:true,at:new Date().toISOString()})});
      }
      renderAll();
    },function(){
      S.mode='local';var saved=loadLocal();
      S.tasks=saved?new Map(saved):new Map(seed());saveLocal();renderAll();
      toast({title:'Cloud save is unavailable',body:'Tasks will be kept in this browser instead.',ttl:5000});
    });
  }else{
    S.mode='local';var saved=loadLocal();
    S.tasks=new Map(saved||seed());saveLocal();renderAll();
  }
})();
})();
</script>
